<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同词相遇</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23DDA3B3' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== 设计令牌 ===== */
:root{
  --ink:#6E6675;
  --muted:#ADA6BA;
  --faint:#D4CEDE;
  --pink:#F0A9BE;
  --pink-deep:#E394AC;
  --pink-soft:#FDEEF3;
  --lav:#B3A8D9;
  --lav-soft:#F3F0FB;
  --gold:#ECC8A0;
  --gold-soft:#FBF3E6;
  --card:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.92);
  --shadow:0 16px 40px rgba(240,169,190,.14);
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 85% -10%, #FCE4EC 0%, rgba(252,228,236,0) 60%),
    radial-gradient(1000px 640px at -10% 110%, #F0EBFA 0%, rgba(240,235,250,0) 60%),
    #FDFAFB;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  display:flex; justify-content:center; align-items:flex-start;
  padding:28px 16px 48px; overflow-y:auto;
}
/* 背景光晕（装饰层） */
.bg-orb{position:fixed; border-radius:50%; filter:blur(56px); opacity:.55; pointer-events:none; z-index:0}
.orb-1{width:280px; height:280px; background:#FAD9E4; top:-80px; right:-60px}
.orb-2{width:240px; height:240px; background:#EBE5F7; bottom:-70px; left:-50px}

.stage{position:relative; z-index:1; width:100%; max-width:400px}
.view{display:flex; flex-direction:column; animation:rise .42s cubic-bezier(.22,.9,.32,1) both}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.hidden{display:none !important}

/* ===== 首页 ===== */
.logo-mark{
  width:60px; height:60px; margin:0 auto 18px; border-radius:20px;
  background:linear-gradient(135deg,#E0A0B3 0%, #A195C2 100%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 28px rgba(206,150,166,.32);
}
.logo-mark svg{width:30px; height:30px}
h1{
  margin:0 0 6px; text-align:center; font-size:32px; font-weight:800; letter-spacing:4px;
  background:linear-gradient(100deg,var(--pink-deep) 0%, #B3A8CE 55%, var(--lav) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--pink-deep);
}
.sub{ margin:0 0 30px; text-align:center; font-size:13.5px; color:var(--muted); letter-spacing:1px}
.hint-chips{display:flex; justify-content:center; gap:8px; margin:0 0 26px; flex-wrap:wrap}
.chip{
  font-size:11.5px; color:var(--lav); background:rgba(167,155,198,.09);
  border:1px solid rgba(167,155,198,.22); padding:5px 10px; border-radius:999px; letter-spacing:.5px;
}

.field{width:100%; margin-bottom:14px}
input.field-input{
  width:100%; height:52px; padding:0 16px; border-radius:var(--r-md); font-size:16px;
  border:1.5px solid transparent; outline:none; color:var(--ink); background:var(--card);
  box-shadow:var(--shadow); text-align:center; transition:border-color .2s, background .2s;
}
input.field-input::placeholder{color:#C7C0D2}
input.field-input:focus{border-color:var(--pink); background:rgba(255,255,255,.92)}
input.code-input{font-size:24px; letter-spacing:10px; font-weight:700; color:var(--pink-deep)}

/* ===== 按钮 ===== */
.btn{
  width:100%; height:52px; border:none; border-radius:var(--r-md); font-size:16px; font-weight:700;
  letter-spacing:1px; cursor:pointer; font-family:inherit;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.2), box-shadow .2s, opacity .2s, background .2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(.965) translateY(1px)}
.btn:disabled{opacity:.55; cursor:default; transform:none}
.btn-primary{
  background:linear-gradient(135deg,var(--pink) 0%, #B6A9CE 60%, var(--lav) 100%);
  color:#fff; box-shadow:0 10px 24px rgba(206,150,166,.34);
}
.btn-primary:not(:disabled):hover{box-shadow:0 14px 30px rgba(206,150,166,.42); transform:translateY(-1px)}
.btn-ghost{
  height:46px; background:transparent; color:var(--muted); font-weight:600; font-size:14.5px;
}
.btn-ghost:not(:disabled):hover{color:var(--ink); background:rgba(255,255,255,.5)}
.btn-sm{height:40px; font-size:14px; width:auto; padding:0 22px; border-radius:999px}
.btn-row{display:flex; flex-direction:column; gap:6px; margin-top:4px}

/* ===== 房间页 ===== */
.room-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px}
.room-code-wrap{display:flex; align-items:center; gap:8px}
.room-label{font-size:12px; color:var(--faint); letter-spacing:1px}
.room-code{
  font-size:20px; font-weight:800; letter-spacing:3px; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px;
  box-shadow:0 6px 18px rgba(206,150,166,.1); font-variant-numeric:tabular-nums;
}
.copy-btn{
  width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
  transition:transform .15s, color .2s, background .2s;
}
.copy-btn:hover{color:var(--pink); transform:scale(1.05)}
.copy-btn:active{transform:scale(.92)}
.copy-btn svg{width:16px; height:16px}
.round-badge{
  align-self:flex-start; font-size:12px; color:#fff; font-weight:700; letter-spacing:1px;
  background:linear-gradient(135deg,var(--pink),var(--lav)); border-radius:999px; padding:5px 12px;
  box-shadow:0 6px 16px rgba(206,150,166,.25);
}
/* 玩家头像条 */
.players-strip{display:flex; justify-content:center; align-items:center; gap:12px; margin:18px 0 6px; flex-wrap:wrap}
.avatar{
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; color:#fff; position:relative; border:3px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,.08); animation:pop .3s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes pop{from{opacity:0; transform:scale(.5)} to{opacity:1; transform:scale(1)}}
.av-a{background:linear-gradient(135deg,#E3A7B9,#D592AB)}
.av-b{background:linear-gradient(135deg,#B0A4CE,#9C8FBE)}
.av-c{background:linear-gradient(135deg,#A0BCE0,#88A7D0)}
.av-d{background:linear-gradient(135deg,#A3CBB4,#84B69C)}
.av-e{background:linear-gradient(135deg,#E6C493,#D4AB6E)}
.avatar .check{
  position:absolute; right:-3px; bottom:-3px; width:19px; height:19px; border-radius:50%;
  background:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15); opacity:0; transform:scale(.4); transition:all .25s;
}
.avatar.is-sub .check{opacity:1; transform:scale(1)}
.avatar .check svg{width:12px; height:12px}
.players-caption{text-align:center; font-size:12.5px; color:var(--muted); margin:6px 0 20px; min-height:18px}

.status-text{text-align:center; font-size:14px; color:var(--pink-deep); font-weight:700; min-height:22px; margin-bottom:16px}
.status-wait{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.65} 50%{opacity:1}}

/* 对局记录 */
.history-head{
  display:flex; align-items:center; justify-content:space-between; margin:8px 0 12px;
}
.history-head .lbl{font-size:12px; color:var(--faint); letter-spacing:2px}
.history-head .names{font-size:11.5px; color:var(--muted); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.history-list{display:flex; flex-direction:column; gap:10px; max-height:270px; overflow-y:auto; padding-bottom:6px; scrollbar-width:thin}
.history-list.poster-history{max-height:none; overflow:visible; gap:8px; padding-bottom:0}
.round-row{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:0 8px 22px rgba(206,150,166,.09); padding:12px 14px;
}
.round-meta{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.round-tag{font-size:11px; font-weight:800; color:var(--pink-deep); letter-spacing:.5px}
.match-tag{
  font-size:10.5px; font-weight:700; color:#A97B2E; background:var(--gold-soft,#F8EFE2);
  border:1px solid rgba(223,185,138,.55); padding:2px 8px; border-radius:999px; letter-spacing:.5px;
}
.words-line{display:flex; align-items:flex-start; justify-content:center; gap:8px; flex-wrap:wrap}
.wgroup{display:flex; flex-direction:column; align-items:center; max-width:44%; gap:4px}
.wplayer{font-size:11px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wbubble{
  width:100%; padding:9px 13px; border-radius:14px; text-align:center; font-size:14.5px; font-weight:700;
  background:#fff; word-break:break-all; box-shadow:0 4px 10px rgba(0,0,0,.04);
}
.w-a{color:#C98C9F; border:1.5px solid #F3DCE4}
.w-b{color:#9C8FBE; border:1.5px solid #E2DCF0}
.w-c{color:#7C9CCB; border:1.5px solid #D7E2F1}
.w-d{color:#6FA385; border:1.5px solid #DCEDE3}
.w-e{color:#B98F4E; border:1.5px solid #F1E3C4}
.vs{font-size:13px; color:#D8D2E2; padding-top:26px; flex-shrink:0}

/* ===== 弹层 ===== */
.overlay{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  padding:20px;
}
.sheet{
  width:100%; max-width:340px; background:#fff; border-radius:var(--r-lg);
  padding:28px 22px 24px; text-align:center; box-shadow:0 24px 60px rgba(206,150,166,.3);
  animation:sheetIn .3s cubic-bezier(.2,.9,.3,1.25) both; max-height:86vh; overflow-y:auto;
}
@keyframes sheetIn{from{opacity:0; transform:scale(.9) translateY(10px)} to{opacity:1; transform:none}}
.sheet-title{margin:0 0 6px; font-size:19px; font-weight:800; line-height:1.45; color:var(--lav)}
.sheet-sub{margin:0 0 18px; font-size:12.5px; color:var(--muted)}
.sheet-title.t-pink{color:var(--pink-deep)}
.mode-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px}
.mode-opt{
  padding:16px 6px; border-radius:var(--r-md); border:1.5px solid rgba(206,150,166,.28);
  background:rgba(206,150,166,.06); cursor:pointer; font-family:inherit;
  transition:all .18s; display:flex; flex-direction:column; gap:4px; align-items:center;
}
.mode-opt:hover{border-color:var(--pink); background:rgba(206,150,166,.12)}
.mode-opt:active{transform:scale(.96)}
.mode-opt b{font-size:17px; color:var(--pink-deep)}
.mode-opt span{font-size:11px; color:var(--muted)}
.mode-opt .dot{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; color:#fff;
}
.mode-opt .dot.d2{background:linear-gradient(135deg,#E3A7B9,#D592AB)}
.mode-opt .dot.d3{background:linear-gradient(135deg,#B0A4CE,#9C8FBE)}
.mode-opt .dot.d4{background:linear-gradient(135deg,#A0BCE0,#88A7D0)}
.mode-opt .dot.d5{background:linear-gradient(135deg,#E6C493,#D4AB6E)}

/* 本轮结算 */
.result-words{display:flex; align-items:flex-start; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.result-words .wgroup{max-width:42%}
.rword{width:100%; padding:10px 14px; border-radius:14px; background:#fff; border:1.5px solid #E8E2F2;
  font-size:16px; font-weight:800; color:var(--lav); box-shadow:0 4px 12px rgba(0,0,0,.05); word-break:break-all}
.rword.hit{
  border-color:transparent;
  background:linear-gradient(135deg,var(--pink) 0%, var(--lav) 100%);
  color:#fff; box-shadow:0 8px 22px rgba(206,150,166,.4); animation:heartbeat 1s ease-in-out 1;
}
/* 相似度梯度档位 */
.sheet-title.t-gold{color:#B9823A}
.sheet-title.t-soft{color:var(--muted)}
#round-result-box.tier-3{background:linear-gradient(180deg,#fff 0%,#FCE4F0 100%); border:1.5px solid #F2BCD6}
#round-result-box.tier-2{background:linear-gradient(180deg,#FFFDF6 0%,#FFE9B8 100%); border:1.5px solid #EFCB86}
#round-result-box.tier-1{background:linear-gradient(180deg,#fff 0%,#FFEFE0 100%); border:1.5px solid #EFC9A8}
#round-result-box.tier-0{background:#fff; border:1.5px solid #E8E2F2}
.rword.t3{background:linear-gradient(135deg,var(--pink),var(--lav)); color:#fff; box-shadow:0 8px 22px rgba(206,150,166,.4); animation:heartbeat 1s ease-in-out 1}
.rword.t2{background:linear-gradient(135deg,#EBCB8A,#DFA45F); color:#fff; box-shadow:0 8px 22px rgba(223,164,95,.45)}
.rword.t1{background:#FFF3E0; color:#B98545; border-color:#EFC9A8; box-shadow:none}
.rword.t0{background:#fff}
/* 结算层紧凑化 */
#round-result-box{max-width:300px; padding:18px 18px 14px; box-shadow:0 16px 40px rgba(206,150,166,.28)}
#round-result-box .sheet-title{font-size:16px; margin-bottom:4px}
#round-result-box .sheet-sub{margin-bottom:12px; font-size:11.5px}
#round-result-box .result-words{margin-bottom:2px}
#round-result-box .wgroup{max-width:44%}
#round-result-box .rword{padding:8px 12px; font-size:15px}
#round-result-box p:last-child{margin:12px 0 0; font-size:11px}
@keyframes heartbeat{0%,100%{transform:scale(1)} 25%{transform:scale(1.06)} 50%{transform:scale(.97)} 75%{transform:scale(1.04)}}

/* ===== 海报页 ===== */
.trophy{width:56px; height:56px; margin:0 auto 10px; border-radius:50%;
  background:linear-gradient(135deg,#F2E2C8, #DFB98A); display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 26px rgba(223,185,138,.4); animation:heartbeat 1.1s ease-in-out 1}
.trophy svg{width:28px; height:28px}
.poster-title{margin:0 0 14px; font-size:20px; font-weight:800; line-height:1.5; text-align:center;
  color:var(--pink-deep)}
.final-word-box{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); padding:16px; margin-bottom:16px; text-align:center;
}
.final-word-box .lbl{display:block; font-size:12px; color:var(--muted); letter-spacing:2px; margin-bottom:10px}
.final-word-box b{display:block; font-size:36px; font-weight:800; letter-spacing:3px;
  background:linear-gradient(100deg,var(--pink-deep),var(--lav)); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:var(--pink-deep); word-break:break-all}
.poster-history .round-row{padding:10px 12px}

/* ===== 彩带 & Toast ===== */
#confetti-canvas{position:fixed; inset:0; z-index:80; pointer-events:none; display:none}
#toast{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
  background:rgba(61,58,69,.92); color:#fff; font-size:13.5px; padding:10px 20px; border-radius:999px;
  z-index:100; opacity:0; pointer-events:none; transition:all .3s cubic-bezier(.2,.9,.3,1.2);
  max-width:82vw; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.18);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="bg-orb orb-1" aria-hidden="true"></div>
<div class="bg-orb orb-2" aria-hidden="true"></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<main class="stage" id="app">
  <!-- ===== 视图：首页 ===== -->
  <section class="view" id="view-home">
    <h1>同词相遇</h1>
    <p class="sub">看看你们的脑回路是否一致</p>
    <div class="hint-chips">
      <span class="chip">各自出词</span><span class="chip">默契判定</span><span class="chip">最多 5 人</span>
    </div>
    <input type="text" id="nickname" class="field-input" placeholder="输入你的昵称" maxlength="10" autocomplete="off">
    <div class="btn-row" style="margin-top:22px">
      <button class="btn btn-primary" id="btn-create" onclick="showModeSelection()">创建新房间</button>
      <button class="btn btn-ghost" id="btn-join-nav" onclick="showJoinView()">加入房间</button>
    </div>
  </section>

  <!-- ===== 视图：加入 ===== -->
  <section class="view hidden" id="view-join">
    <h1 style="font-size:26px; letter-spacing:2px; margin-bottom:4px">加入房间</h1>
    <p class="sub" style="margin-bottom:26px">输入房主分享给你的 4 位房间号</p>
    <input type="text" id="join-code" class="field-input code-input" placeholder="0000" maxlength="4" autocomplete="off" inputmode="numeric">
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" id="btn-join" onclick="joinGame()">确认加入</button>
      <button class="btn btn-ghost" onclick="goHome()">返回</button>
    </div>
    <p id="join-error" class="hidden" style="text-align:center; color:#E06C6C; font-size:13px; margin:14px 0 0"></p>
  </section>

  <!-- ===== 视图：房间 ===== -->
  <section class="view hidden" id="view-room">
    <div class="room-top">
      <div class="room-code-wrap">
        <span class="room-label">房间号</span>
        <span class="room-code" id="display-room-code">0000</span>
        <button class="copy-btn" id="copy-room-btn" aria-label="复制房间号" title="复制房间号">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <span class="round-badge" id="round-badge">第 1 轮</span>
    </div>
    <div class="players-strip" id="players-strip"></div>
    <p class="players-caption" id="players-caption"></p>
    <p class="status-text" id="room-status" aria-live="polite"></p>
    <div id="game-play-area" class="hidden">
      <input type="text" id="word-input" class="field-input" placeholder="想一个词，提交后看大家的答案…" maxlength="20" autocomplete="off">
      <button class="btn btn-primary" id="btn-submit" onclick="submitWord()" style="margin-top:12px">提交</button>
    </div>
    <div id="history-area" class="hidden">
      <div class="history-head">
        <span class="lbl">对局记录</span>
        <span class="names" id="history-names"></span>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
    <button class="btn btn-ghost" onclick="goHome()" style="margin-top:18px">退出房间</button>
  </section>

  <!-- ===== 视图：海报 ===== -->
  <section class="view hidden" id="view-poster">
    <div class="trophy" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M18 4h2a2 2 0 0 1 2 2v1a5 5 0 0 1-5 5h-.35A6 6 0 0 1 13 14.93V18h2a1 1 0 0 1 0 2h-6a1 1 0 0 1 0-2h2v-3.07A6 6 0 0 1 7.35 12H7a5 5 0 0 1-5-5V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v1zM5 5H4v2a3 3 0 0 0 3 3V6a1 1 0 0 0-1-1h-1zm14 0h-1a1 1 0 0 0-1 1v4a3 3 0 0 0 3-3V5z"/></svg>
    </div>
    <h2 class="poster-title" id="poster-title"></h2>
    <div class="final-word-box">
      <span class="lbl">最终相同词语</span>
      <b id="poster-final-word">-</b>
    </div>
    <div class="history-head"><span class="lbl">默契历程</span></div>
    <div class="history-list poster-history" id="poster-history"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-primary" onclick="restartGame()">再玩一次</button>
      <button class="btn btn-ghost" onclick="goHome()">回到首页</button>
    </div>
  </section>
</main>

<!-- ===== 弹层：选择人数 ===== -->
<div class="overlay hidden" id="mode-overlay">
  <div class="sheet">
    <h3 class="sheet-title">选几个人一起玩？</h3>
    <p class="sheet-sub">房间创建后，把房间号发给朋友们</p>
    <div class="mode-grid">
      <button class="mode-opt" onclick="createGame('2')"><span class="dot d2">2</span><b>双人</b><span>两个人的默契</span></button>
      <button class="mode-opt" onclick="createGame('3')"><span class="dot d3">3</span><b>三人</b><span>三角对齐</span></button>
      <button class="mode-opt" onclick="createGame('4')"><span class="dot d4">4</span><b>四人</b><span>小圈子测试</span></button>
      <button class="mode-opt" onclick="createGame('5')"><span class="dot d5">5</span><b>五人</b><span>派对模式</span></button>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="hideModeSelection()">取消</button>
  </div>
</div>

<!-- ===== 弹层：本轮结算 ===== -->
<div class="overlay hidden" id="round-result-overlay">
  <div class="sheet" role="dialog" aria-label="本轮结果" id="round-result-box">
    <h3 class="sheet-title" id="round-result-title"></h3>
    <p class="sheet-sub" id="round-result-sub"></p>
    <div class="result-words" id="round-result-words"></div>
    <p style="margin:18px 0 0; font-size:12px; color:var(--faint)">即将自动进入下一轮…</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="text-align:center; padding:40px 20px; color:#9A93A8">此游戏需要启用 JavaScript 才能运行。</p></noscript>

<script>
/* ================= 配置（保持不变，你的 Supabase 后端契约） ================= */
const SUPABASE_URL = 'https://wpvvgctsxgljzikrtedk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ecr2t1v8CEUG1LwPNsLvbQ_5F0BXm2y';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentRoomCode = null;
let pollTimer = null;
let myName = '';
let myRole = 'A';
let isTransitioning = false;
let celebrating = false;
let lastStripSig = '';
let lastHistSig = '';
let lastAdvancedKey = -1;
let settleUntil = 0; // 推进后多久内不再接受服务端旧状态触发结算层
let overlayShownAt = 0; // 结算层展示起始时间（轮询驱动推进，防定时器节流）
let pendingAdvKey = -1;
let lastShownHistLen = 0; // 已弹过结算的历史条数，防止同一轮重复弹出

/* ================= 工具 ================= */
// HTML 转义：昵称/词语都是用户输入，禁止直接拼进 innerHTML（防 XSS）
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 只去掉服务端追加在房主名后的 "_2/_3" 模式后缀，昵称里的下划线保留
function cleanName(n){ return n ? String(n).replace(/_\d+$/, '') : ''; }
function normalize(s){ return String(s || '').replace(/\s+/g, '').toLowerCase(); }
function wordSimilarity(a, b){
  a = normalize(a); b = normalize(b);
  if (a === b) return 1;
  if (!a || !b) return 0;
  if (a.includes(b) || b.includes(a)) return 0.8;
  const setB = new Set(b.split(''));
  let m = 0;
  for (const ch of a.split('')) if (setB.has(ch)) m++;
  return (m * 2) / (a.length + b.length);
}
const tipLib = {
  close: ['差一点点就猜中了！','脑电波快要对上了！','方向完全一致嘛！','就差一毫米的默契！'],
  far: ['简直是跨服聊天呀……','你们在同一个次元吗？','这脑回路差了十万八千里～','一个在南极，一个在北极。']
};
const pickTip = k => tipLib[k][Math.floor(Math.random() * tipLib[k].length)];

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function showView(id){
  document.querySelectorAll('#app > .view').forEach(v => v.classList.add('hidden'));
  const v = document.getElementById(id);
  v.classList.remove('hidden');
}
function setLoading(btn, loading){
  if (!btn) return;
  btn.disabled = loading;
}

/* ================= 流程 ================= */
function checkNickname(){
  const name = document.getElementById('nickname').value.trim();
  if (!name){ toast('先给自己取个昵称吧'); return null; }
  myName = name;
  return name;
}
function showJoinView(){ if (checkNickname()) showView('view-join'); }
function showModeSelection(){ if (checkNickname()) document.getElementById('mode-overlay').classList.remove('hidden'); }
function hideModeSelection(){ document.getElementById('mode-overlay').classList.add('hidden'); }

function goHome(){
  document.getElementById('round-result-overlay').classList.add('hidden');
  hideModeSelection();
  document.getElementById('join-error').classList.add('hidden');
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  currentRoomCode = null;
  isTransitioning = false;
  celebrating = false;
  document.getElementById('confetti-canvas').style.display = 'none';
  showView('view-home');
}

async function ensureAuth(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session){ currentUser = session.user; return; }
  const { data, error } = await supabaseClient.auth.signInAnonymously();
  if (error) throw new Error('登录失败：' + error.message);
  currentUser = data.user;
}

async function createGame(mode){
  hideModeSelection();
  const btn = document.getElementById('btn-create');
  setLoading(btn, true);
  try {
    await ensureAuth();
    const { data, error } = await supabaseClient.rpc('create_game', { p_name: myName + '_' + mode });
    if (error) throw error;
    currentRoomCode = data.room_code;
    myRole = 'A';
    enterRoomView(currentRoomCode);
    toast('房间已创建');
  } catch (err){
    toast(err.message || '创建房间失败，请检查网络或后端配置');
  } finally { setLoading(btn, false); }
}

async function joinGame(){
  if (!checkNickname()) return;
  const code = document.getElementById('join-code').value.trim();
  const errEl = document.getElementById('join-error');
  if (!/^\d{4}$/.test(code)){
    errEl.innerText = '房间号是 4 位数字';
    errEl.classList.remove('hidden');
    return;
  }
  const btn = document.getElementById('btn-join');
  setLoading(btn, true);
  try {
    await ensureAuth();
    const { data, error } = await supabaseClient.rpc('join_game', { p_code: code, p_name: myName });
    if (error) throw new Error(error.message);
    if (data && data.error) throw new Error(data.error);
    myRole = data.role;
    currentRoomCode = code;
    enterRoomView(currentRoomCode);
  } catch (err){
    errEl.innerText = err.message;
    errEl.classList.remove('hidden');
  } finally { setLoading(btn, false); }
}

function enterRoomView(code){
  document.getElementById('display-room-code').innerText = code;
  document.getElementById('join-error').classList.add('hidden');
  isTransitioning = false;
  lastStripSig = '';
  lastHistSig = '';
  lastAdvancedKey = -1;
  lastShownHistLen = 0;
  showView('view-room');
  checkRoomState();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(checkRoomState, 1200);
}

/* ================= 玩家信息 ================= */
function playerSlots(data){
  const slots = [];
  ['a','b','c','d','e'].forEach(k => {
    if (data['player_' + k + '_name']){
      slots.push({
        role: k.toUpperCase(),
        name: cleanName(data['player_' + k + '_name']),
        submitted: !!data['has_' + k + '_submitted']
      });
    }
  });
  return slots;
}
function renderPlayers(data){
  const strip = document.getElementById('players-strip');
  const cap = document.getElementById('players-caption');
  const slots = playerSlots(data);
  if (!slots.length){ strip.innerHTML = ''; cap.textContent = ''; lastStripSig = ''; return; }
  const subCount = slots.filter(s => s.submitted).length;
  // 只有头像组成/提交状态真的变化时才重绘，否则轮询时会反复触发入场动画造成闪烁
  const sig = slots.map(s => s.role + ':' + s.name + (s.submitted ? '1' : '0')).join('|');
  if (sig !== lastStripSig){
    lastStripSig = sig;
    strip.innerHTML = slots.map(s => `
      <div class="avatar av-${s.role.toLowerCase()} ${s.submitted ? 'is-sub' : ''}">
        ${esc(s.name.slice(0, 1))}
        <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#84B69C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
      </div>`).join('');
  }
  if (data.status === 'waiting') cap.textContent = `${slots.length} 人已加入`;
  else cap.textContent = subCount === slots.length ? '全部提交，正在判定…' : `${subCount}/${slots.length} 已提交`;
}

/* ================= 轮询主流程 ================= */
function extractWords(round, data){
  const arr = [];
  [['a','A','w-a'],['b','B','w-b'],['c','C','w-c'],['d','D','w-d'],['e','E','w-e']].forEach(([k, role, cls]) => {
    const w = round['player_' + k + '_word'];
    if (w != null) arr.push({ role, name: cleanName(data['player_' + k + '_name']), word: String(w), cls });
  });
  return arr;
}
// 返回 {kind:'all'|'match'|'close'|'far', winners:[name...], hitRoles:[role...]}
function judgeRound(wordsArr){
  if (wordsArr.length < 2) return { kind: 'wait', winners: [], hitRoles: [] };
  const uniq = new Set(wordsArr.map(w => normalize(w.word)));
  if (uniq.size === 1) return { kind: 'all', winners: wordsArr.map(w => w.name), hitRoles: wordsArr.map(w => w.role) };
  const hits = new Set();
  const winners = [];
  for (let i = 0; i < wordsArr.length; i++){
    for (let j = i + 1; j < wordsArr.length; j++){
      if (normalize(wordsArr[i].word) === normalize(wordsArr[j].word)){
        hits.add(wordsArr[i].role); hits.add(wordsArr[j].role);
      }
    }
  }
  if (hits.size){
    wordsArr.forEach(w => { if (hits.has(w.role)) winners.push(w.name); });
    return { kind: 'match', winners, hitRoles: [...hits] };
  }
  let close = false;
  for (let i = 0; i < wordsArr.length && !close; i++)
    for (let j = i + 1; j < wordsArr.length && !close; j++)
      if (wordSimilarity(wordsArr[i].word, wordsArr[j].word) >= 0.3) close = true;
  return close ? { kind: 'close', winners: [], hitRoles: [] } : { kind: 'far', winners: [], hitRoles: [] };
}

async function checkRoomState(){
  if (!currentRoomCode) return;
  // 轮询驱动推进：结算展示满 3 秒由房主推进（即使 setTimeout 被浏览器节流也不会卡死）
  if (isTransitioning && myRole === 'A' && overlayShownAt && Date.now() - overlayShownAt >= 3000 && pendingAdvKey !== lastAdvancedKey){
    lastAdvancedKey = pendingAdvKey;
    advanceRound();
    return;
  }
  if (isTransitioning || celebrating) return;
  try {
    const { data, error } = await supabaseClient.rpc('get_game_state', { p_code: currentRoomCode });
    if (error) throw error;
    if (!data) return;
    const history = Array.isArray(data.history) ? data.history : [];

    // 大结局
    if (data.is_win){
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      document.getElementById('round-result-overlay').classList.add('hidden');
      showView('view-poster');
      renderPoster(data);
      celebrating = true;
      startConfetti();
      return;
    }

    const statusEl = document.getElementById('room-status');
    const playArea = document.getElementById('game-play-area');
    const historyArea = document.getElementById('history-area');
    const overlay = document.getElementById('round-result-overlay');

    renderPlayers(data);

    if (data.status === 'waiting'){
      statusEl.innerText = '等待玩家加入…';
      statusEl.classList.add('status-wait');
      playArea.classList.add('hidden');
      historyArea.classList.add('hidden');
      return;
    }

    statusEl.classList.remove('status-wait');
    // 轮次按实际对局顺序显示，不读服务端内部计数器（避免服务端跳号导致显示错乱）
    const currentRound = history.length + 1;
    document.getElementById('round-badge').innerText = '第 ' + currentRound + ' 轮';

    if (history.length){ historyArea.classList.remove('hidden'); renderHistory(history, data); }
    else historyArea.classList.add('hidden');

    const slots = playerSlots(data);
    const submittedAll = slots.length > 0 && slots.every(s => s.submitted);
    if (submittedAll){
      playArea.classList.add('hidden');
      statusEl.innerText = '本轮结算';
      const latestWords = extractWords(history[0], data);
      if (overlay.classList.contains('hidden') && history.length && Date.now() > settleUntil && history.length !== lastShownHistLen && latestWords.length >= 2){
        isTransitioning = true;
        overlayShownAt = Date.now();
        pendingAdvKey = currentRound;
        lastShownHistLen = history.length;
        overlay.classList.remove('hidden');
        try { renderRoundResult(history[0], data, history.length); }
        catch (e){ console.error('结算渲染失败', e); }
        const advKey = currentRound;
        setTimeout(() => {
          if (!isTransitioning) return;
          if (myRole === 'A' && advKey !== lastAdvancedKey){
            lastAdvancedKey = advKey;
            advanceRound();
          } else {
            // 收起结算层并加静默窗口：服务端旧状态延迟回来不会再重复弹出
            isTransitioning = false;
            settleUntil = Date.now() + 5000;
            document.getElementById('round-result-overlay').classList.add('hidden');
            checkRoomState();
          }
        }, 3000);
      }
    } else {
      overlay.classList.add('hidden');
      const me = slots.find(s => s.role === myRole);
      if (me && me.submitted){
        statusEl.innerText = '已提交，等其他人…';
        playArea.classList.add('hidden');
      } else {
        statusEl.innerText = '第 ' + currentRound + ' 轮，想一个词吧';
        playArea.classList.remove('hidden');
        document.getElementById('word-input').focus();
      }
    }
  } catch (err){
    console.error('轮询出错', err);
  }
}

async function advanceRound(){
  if (!isTransitioning) return;
  isTransitioning = false;
  settleUntil = Date.now() + 5000; // 5 秒静默窗口，忽略服务端旧状态的重复结算触发
  document.getElementById('round-result-overlay').classList.add('hidden');
  try { await supabaseClient.rpc('next_round', { p_code: currentRoomCode }); }
  catch (e){ console.error('next_round', e); }
  checkRoomState();
}

/* ================= 渲染：本轮结算 ================= */
function renderRoundResult(round, data, roundNo){
  const words = extractWords(round, data);
  const judge = judgeRound(words);
  const titleEl = document.getElementById('round-result-title');
  const subEl = document.getElementById('round-result-sub');
  const boxEl = document.getElementById('round-result-box');
  const box = document.getElementById('round-result-words');
  const total = words.length;

  // 任意两词的最大相似度，决定颜色梯度档位
  let maxSim = 0;
  for (let i = 0; i < words.length; i++)
    for (let j = i + 1; j < words.length; j++)
      maxSim = Math.max(maxSim, wordSimilarity(words[i].word, words[j].word));

  let tier, title, cardCls, titleCls;
  if (judge.kind === 'all'){
    tier = 'tier-3'; title = '全员想到了一起！'; cardCls = 't3'; titleCls = 't-pink';
  } else if (judge.kind === 'match'){
    tier = 'tier-3'; title = esc(judge.winners.join(' 和 ')) + ' 想到了一起！'; cardCls = 't3'; titleCls = 't-pink';
  } else if (maxSim >= 0.5){
    tier = 'tier-2'; title = '这么接近？脑电波快对上了！'; cardCls = 't2'; titleCls = 't-gold';
  } else if (maxSim >= 0.3){
    tier = 'tier-1'; title = pickTip('close'); cardCls = 't1'; titleCls = 't-soft';
  } else {
    tier = 'tier-0'; title = pickTip('far'); cardCls = 't0'; titleCls = 't-soft';
  }
  boxEl.className = 'sheet ' + tier;
  titleEl.className = 'sheet-title ' + titleCls;
  titleEl.textContent = title;
  subEl.textContent = `第 ${roundNo} 轮 · ${total} 位玩家 · 相似度 ${Math.round(maxSim * 100)}%`;

  box.innerHTML = words.map(w => `
    <div class="wgroup">
      <span class="wplayer">${esc(w.name)}</span>
      <div class="rword ${cardCls}">${esc(w.word)}</div>
    </div>`).join('');
}

/* ================= 渲染：历史记录 ================= */
function renderHistory(history, data){
  const listEl = document.getElementById('history-list');
  const namesEl = document.getElementById('history-names');
  const slots = playerSlots(data);
  namesEl.textContent = slots.map(s => s.name).join(' · ');
  const sig = history.map(h => [h.round_number, h.player_a_word, h.player_b_word, h.player_c_word, h.player_d_word, h.player_e_word].join('|')).join('||');
  if (sig === lastHistSig) return;
  lastHistSig = sig;
  const asc = [...history].sort((a, b) => (a.round_number || 0) - (b.round_number || 0));
  const ordByRow = new Map(asc.map((h, i) => [h, i + 1]));
  const sorted = [...history].sort((a, b) => b.round_number - a.round_number);
  listEl.innerHTML = '';
  sorted.forEach(item => {
    const words = extractWords(item, data);
    const judge = judgeRound(words);
    const row = document.createElement('div');
    row.className = 'round-row';
    row.innerHTML = `
      <div class="round-meta">
        <span class="round-tag">第 ${ordByRow.get(item)} 轮</span>
        ${judge.kind === 'all' || judge.kind === 'match' ? '<span class="match-tag">默契</span>' : ''}
      </div>
      <div class="words-line">${words.map((w, i) => `
        ${i ? '<span class="vs">×</span>' : ''}
        <div class="wgroup"><span class="wplayer">${esc(w.name)}</span><div class="wbubble ${w.cls}">${esc(w.word)}</div></div>`).join('')}
      </div>`;
    listEl.appendChild(row);
  });
}

/* ================= 渲染：海报 ================= */
function renderPoster(data){
  const finalWord = data.player_a_word;
  document.getElementById('poster-final-word').innerText = finalWord;

  const words = [];
  [['a','A'],['b','B'],['c','C'],['d','D'],['e','E']].forEach(([k, role]) => {
    if (data['player_' + k + '_word'] != null) words.push({ role, name: cleanName(data['player_' + k + '_name']), word: String(data['player_' + k + '_word']) });
  });
  const winners = [...new Set(words.filter(w => w.word === finalWord).map(w => w.name))];
  const titleEl = document.getElementById('poster-title');
  if (winners.length > 2) titleEl.innerHTML = '天呐！全员天选之子，<br>这默契度太高了吧！';
  else titleEl.innerHTML = `${winners.map(esc).join(' 和 ')} 想到了一起！`;

  const listEl = document.getElementById('poster-history');
  listEl.innerHTML = '';
  const history = Array.isArray(data.history) ? data.history : [];
  const sorted = [...history].sort((a, b) => a.round_number - b.round_number);
  sorted.forEach((item, idx) => {
    const wordsArr = extractWords(item, data);
    const judge = judgeRound(wordsArr);
    const row = document.createElement('div');
    row.className = 'round-row';
    row.innerHTML = `
      <div class="round-meta">
        <span class="round-tag">第 ${idx + 1} 轮</span>
        ${judge.kind === 'all' || judge.kind === 'match' ? '<span class="match-tag">默契</span>' : ''}
      </div>
      <div class="words-line">${wordsArr.map((w, i) => `
        ${i ? '<span class="vs">×</span>' : ''}
        <div class="wgroup"><span class="wplayer">${esc(w.name)}</span><div class="wbubble ${w.cls}">${esc(w.word)}</div></div>`).join('')}
      </div>`;
    listEl.appendChild(row);
  });
}

async function restartGame(){
  try {
    const { error } = await supabaseClient.rpc('restart_game', { p_code: currentRoomCode });
    if (error) throw error;
    document.getElementById('round-result-overlay').classList.add('hidden');
    document.getElementById('confetti-canvas').style.display = 'none';
    celebrating = false;
    isTransitioning = false;
    enterRoomView(currentRoomCode);
    toast('再来一轮！');
  } catch (err){ toast('重开失败：' + err.message); }
}

/* ================= 提交 ================= */
async function submitWord(){
  const input = document.getElementById('word-input');
  const word = input.value.trim();
  if (!word){ toast('先想一个词吧'); input.focus(); return; }
  const btn = document.getElementById('btn-submit');
  setLoading(btn, true);
  try {
    const { error } = await supabaseClient.rpc('submit_game_word', { p_code: currentRoomCode, p_word: word });
    if (error) throw error;
    input.value = '';
    checkRoomState();
  } catch (err){ toast('提交失败：' + err.message); }
  finally { setLoading(btn, false); }
}

/* ================= 彩带 ================= */
function startConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const W = (canvas.width = window.innerWidth);
  const H = (canvas.height = window.innerHeight);
  const colors = ['#E3A7B9', '#D592AB', '#B0A4CE', '#9C8FBE', '#E6C493', '#F7E4E9'];
  const parts = [];
  for (let i = 0; i < 140; i++){
    parts.push({
      x: Math.random() * W,
      y: Math.random() * H - H,
      w: Math.random() * 8 + 4,
      h: Math.random() * 8 + 4,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 2.4 + 1.6,
      vx: (Math.random() - 0.5) * 1.6,
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 12,
      life: 1
    });
  }
  let frame = 0;
  function tick(){
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    parts.forEach(p => {
      p.y += p.vy; p.x += p.vx + Math.sin(frame / 18 + p.x) * 0.3; p.rot += p.vr;
      if (p.y < H + 30) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = p.y > H * 0.85 ? 1 - (p.y - H * 0.85) / (H * 0.15) : 1;
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && canvas.style.display !== 'none') requestAnimationFrame(tick);
  }
  tick();
}

/* ================= 交互绑定 ================= */
document.getElementById('copy-room-btn').addEventListener('click', function(){
  const code = document.getElementById('display-room-code').innerText;
  const done = () => toast('房间号已复制：' + code);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
  } else fallbackCopy(code, done);
});
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e){ toast('复制失败，请手动记下房间号'); }
  ta.remove();
}
document.getElementById('word-input').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); submitWord(); }
});
document.getElementById('join-code').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); joinGame(); }
});
document.getElementById('nickname').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); showModeSelection(); }
});
document.getElementById('join-code').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});
