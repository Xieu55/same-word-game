<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同词相遇</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FFF5F7;        /* 樱花浅粉背景 */
            --card-bg: #FFFFFF;         /* 纯白卡片 */
            --primary: #F7A8B8;         /* 柔和主粉 */
            --primary-hover: #F490A3;   
            --text-main: #4A4A4A;       
            --text-muted: #A0A0A0;      
            --accent-lilac: #E2D4F0;    /* 淡紫色 */
            --cream: #FFFDF9;           
            --radius: 24px;            
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px 24px;
            box-shadow: 0 8px 32px rgba(247, 168, 184, 0.15); 
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        
        .top-tag { text-align: center; font-size: 12px; color: var(--primary); font-weight: bold; letter-spacing: 1px; margin-bottom: 8px;}
        h2 { text-align: center; color: var(--text-main); margin: 0 0 16px 0; font-size: 24px;}
        p { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        
        input {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--accent-lilac);
            background-color: var(--cream);
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--primary); background-color: #FFF; }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(247, 168, 184, 0.3);
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        
        .room-tag {
            display: block; text-align: center; font-size: 12px; color: var(--text-muted);
            margin: 10px auto 20px auto; background: #F9F6F8; padding: 6px 12px; border-radius: 20px; width: fit-content;
        }
        
        .status-text { text-align: center; font-size: 15px; color: var(--text-muted); margin-bottom: 20px;}
        
        .history-container {
            margin-top: 20px; border-top: 1px dashed #EEE; padding-top: 15px; max-height: 250px; overflow-y: auto;
        }
        .history-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .history-label { font-size: 12px; color: #BBB; width: 45px; }
        
        .word-box { flex: 1; padding: 10px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 15px; color: var(--text-main); }
        .word-a { background-color: #FFF0F5; color: #D87A94; } 
        .word-b { background-color: #F5F0FA; color: #8E7AA8; } 
        .vs-mark { font-size: 12px; color: #DDD; margin: 0 10px; }
        
        .history-item.win-round .word-box { background-color: #E8F5E9; color: #2E7D32; }

        /* 结算海报样式 */
        .poster { text-align: center; padding: 10px 0; }
        .poster-title { font-size: 26px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .poster-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .poster-divider { border-top: 1px dashed #EAEAEA; margin: 20px 0; }
        .poster-stats { font-size: 14px; color: #666; margin-bottom: 20px; background: var(--cream); padding: 15px; border-radius: 16px; border: 1px dashed var(--accent-lilac);}
        .poster-stats b { color: var(--primary); font-size: 20px; margin: 0 4px; }
    </style>
</head>
<body>

    <div class="card" id="app">
        <div id="view-home">
            <div class="top-tag">SAME WORD · 同词相遇</div>
            <h2>你们的脑回路相遇了</h2>
            <p>直到你们想出同一个词</p>
            <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            <button onclick="createGame()">创建新房间</button>
            <button onclick="showJoinView()" style="background-color: var(--accent-lilac); color: #666; box-shadow: none;">加入房间</button>
        </div>

        <div id="view-join" class="hidden">
            <h2>加入房间</h2>
            <input type="text" id="join-code" placeholder="输入4位房间号" maxlength="4" style="font-size: 24px; letter-spacing: 4px;">
            <button onclick="joinGame()">确认加入</button>
            <button onclick="goHome()" style="background-color: transparent; color: #888; box-shadow: none;">返回</button>
            <div id="join-error" style="color: red; text-align: center; font-size: 14px; margin-top: 10px;" class="hidden"></div>
        </div>

        <div id="view-room" class="hidden">
            <h2>房间中</h2>
            <span class="room-tag">房间号: <b id="display-room-code">0000</b></span>
            
            <div id="room-status" class="status-text">等待对方加入...</div>
            
            <div id="game-play-area" class="hidden">
                <input type="text" id="word-input" placeholder="输入你想到的词..." maxlength="20">
                <button onclick="submitWord()">提交词语</button>
            </div>

            <!-- 历史记录区，只要进房间就一直展示 -->
            <div id="history-area" class="hidden">
                <div class="history-container" id="history-list"></div>
            </div>
            
            <button onclick="goHome()" style="background-color: transparent; color: #CCC; box-shadow: none; margin-top: 10px; font-size: 14px;">退出房间</button>
        </div>

        <!-- 结算海报视图 -->
        <div id="view-poster" class="hidden">
            <div class="poster">
                <div class="top-tag">SAME WORD · 同词相遇</div>
                <h2 class="poster-title">你们的脑回路相遇了</h2>
                <div class="poster-subtitle">房间 <span id="poster-room-code">-</span> · 共 <span id="poster-rounds">0</span> 轮</div>
                
                <div class="poster-stats">
                    最终默契词语：<b id="poster-final-word">-</b>
                </div>

                <div class="history-container" id="poster-history-list" style="max-height: 300px;"></div>
                
                <div class="poster-divider"></div>
                <p style="font-size: 12px; margin: 0;">表达可以不同，只要想到的是同一个东西。</p>
                
                <button onclick="goHome()" style="margin-top: 20px;">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wpvvgctsxgljzikrtedk.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_Ecr2t1v8CEUG1LwPNsLvbQ_5F0BXm2y';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRoomCode = null;
        let pollInterval = null;
        let myName = "";

        function showView(viewId) {
            document.querySelectorAll('.card > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showJoinView() {
            if(!checkNickname()) return;
            showView('view-join');
        }

        function goHome() {
            document.getElementById('join-error').classList.add('hidden');
            showView('view-home');
            if(pollInterval) clearInterval(pollInterval);
            currentRoomCode = null;
        }

        function checkNickname() {
            const name = document.getElementById('nickname').value.trim();
            if(!name) { alert('请先输入昵称哦~'); return false; }
            myName = name;
            return true;
        }

        async function ensureAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw new Error("匿名登录失败: " + error.message);
                currentUser = data.user;
            } else {
                currentUser = session.user;
            }
        }

        async function createGame() {
            if(!checkNickname()) return;
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('create_game', { p_name: myName });
                if (error) throw error;
                currentRoomCode = data.room_code;
                enterRoomView(currentRoomCode);
            } catch (err) { alert(err.message); }
        }

        async function joinGame() {
            if(!checkNickname()) return;
            const code = document.getElementById('join-code').value.trim();
            const errorEl = document.getElementById('join-error');
            if(!code || code.length !== 4) {
                errorEl.innerText = "请输入正确的4位房间号";
                errorEl.classList.remove('hidden');
                return;
            }
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('join_game', { p_code: code, p_name: myName });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                currentRoomCode = code;
                enterRoomView(currentRoomCode);
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function enterRoomView(code) {
            showView('view-room');
            document.getElementById('display-room-code').innerText = code;
            checkRoomState();
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkRoomState, 1500); 
        }

        async function checkRoomState() {
            if(!currentRoomCode) return;
            try {
                const { data, error } = await supabaseClient.rpc('get_game_state', { p_code: currentRoomCode });
                if (error) throw error;

                if (data.is_win) {
                    if(pollInterval) clearInterval(pollInterval);
                    showView('view-poster');
                    renderPoster(data);
                    return;
                }

                const statusEl = document.getElementById('room-status');
                const playArea = document.getElementById('game-play-area');
                const historyArea = document.getElementById('history-area');

                if (data.status === 'waiting') {
                    statusEl.innerText = "等待对方加入...";
                    playArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                } else if (data.status === 'playing') {
                    
                    // 🟢 修复重点：只要房间开始游戏了，有历史记录就永远展示出来
                    if (data.history && data.history.length > 0) {
                        historyArea.classList.remove('hidden');
                        renderHistory(data.history);
                    } else {
                        historyArea.classList.add('hidden');
                    }

                    const isMeA = (myName === data.player_a_name);

                    if (data.player_a_word === null && data.player_b_word === null) {
                        statusEl.innerText = `第 ${data.current_round} 回合，请出题`;
                        playArea.classList.remove('hidden');
                        document.getElementById('word-input').value = ''; 
                    } else {
                        const iSubmitted = isMeA ? data.has_a_submitted : data.has_b_submitted;
                        if (iSubmitted) {
                            statusEl.innerText = "已提交，等待对方...";
                            playArea.classList.add('hidden');
                        } else {
                            statusEl.innerText = `第 ${data.current_round} 回合，请出题`;
                            playArea.classList.remove('hidden');
                        }
                    }
                }
            } catch (err) { console.error("轮询出错", err); }
        }

        function renderHistory(history) {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            history.forEach(item => {
                const isWin = (item.player_a_word === item.player_b_word && item.player_a_word !== null);
                const div = document.createElement('div');
                div.className = `history-item ${isWin ? 'win-round' : ''}`;
                div.innerHTML = `
                    <div class="history-label">第${item.round_number}轮</div>
                    <div class="word-box word-a">${item.player_a_word || '...'}</div>
                    <div class="vs-mark">×</div>
                    <div class="word-box word-b">${item.player_b_word || '...'}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function renderPoster(data) {
            document.getElementById('poster-room-code').innerText = data.room_code;
            document.getElementById('poster-rounds').innerText = data.history.length;
            document.getElementById('poster-final-word').innerText = data.player_a_word;

            const listEl = document.getElementById('poster-history-list');
            listEl.innerHTML = '';
            const sortedHistory = [...data.history].sort((a, b) => a.round_number - b.round_number);
            
            sortedHistory.forEach(item => {
                const isWin = (item.player_a_word === item.player_b_word && item.player_a_word !== null);
                const div = document.createElement('div');
                div.className = `history-item ${isWin ? 'win-round' : ''}`;
                div.innerHTML = `
                    <div class="history-label">第${item.round_number}轮</div>
                    <div class="word-box word-a">${item.player_a_word || '...'}</div>
                    <div class="vs-mark">×</div>
                    <div class="word-box word-b">${item.player_b_word || '...'}</div>
                `;
                listEl.appendChild(div);
            });
        }

        async function submitWord() {
            const word = document.getElementById('word-input').value.trim();
            if(!word) return alert("词语不能为空");
            try {
                const { data, error } = await supabaseClient.rpc('submit_game_word', { p_code: currentRoomCode, p_word: word });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                checkRoomState(); 
            } catch (err) { alert("提交失败: " + err.message); }
        }
    </script>
</body>
</html>
