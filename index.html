<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同词相遇</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FFF5F7;       
            --card-bg: #FFFFFF;        
            --primary-pink: #F7A8B8;   
            --hover-pink: #F490A3;     
            --text-main: #4A4A4A;      
            --accent-lilac: #E2D4F0;   
            --cream: #FFFDF9;          
            --radius: 20px;            
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 24px;
            box-shadow: 0 8px 24px rgba(247, 168, 184, 0.15);
            width: 100%;
            max-width: 360px;
        }
        .hidden { display: none !important; }
        h2 { text-align: center; color: var(--primary-pink); margin-top: 0; }
        p { text-align: center; font-size: 14px; color: #888; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--accent-lilac);
            background-color: var(--cream);
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: var(--primary-pink); }
        button {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        button:hover { background-color: var(--hover-pink); transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        .room-code {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-pink);
            letter-spacing: 4px;
            text-align: center;
            margin: 15px 0;
            padding: 12px;
            background: var(--cream);
            border-radius: var(--radius);
            border: 2px dashed var(--accent-lilac);
        }
        .status-text { text-align: center; font-weight: bold; margin-top: 10px; color: #555;}
        
        /* 历史记录列表样式 */
        .history-container {
            margin-top: 20px;
            border-top: 1px dashed #eee;
            padding-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-title {
            font-size: 14px;
            color: #999;
            text-align: center;
            margin-bottom: 10px;
        }
        .history-item {
            background-color: var(--cream);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item.win-round {
            background-color: #E8F5E9;
            border: 1px solid #C8E6C9;
        }
        .word-tag { background: white; padding: 2px 8px; border-radius: 5px; border: 1px solid #eee; }
        
        .win-banner {
            text-align: center;
            background: #E8F5E9;
            color: #2E7D32;
            padding: 15px;
            border-radius: var(--radius);
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- 首页 -->
        <div id="view-home">
            <h2>同词相遇 🌸</h2>
            <p>默契大考验，直到你们想出同一个词</p>
            <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            <button onclick="createGame()">创建新房间</button>
            <button onclick="showJoinView()" style="background-color: var(--accent-lilac); color: #555;">加入房间</button>
        </div>

        <!-- 加入房间 -->
        <div id="view-join" class="hidden">
            <h2>加入房间</h2>
            <input type="text" id="join-code" placeholder="输入4位房间号" maxlength="4" style="text-align: center; font-size: 24px; letter-spacing: 4px;">
            <button onclick="joinGame()">确认加入</button>
            <button onclick="goHome()" style="background-color: transparent; color: #888; box-shadow: none; border: 1px solid #ddd;">返回</button>
            <div id="join-error" style="color: red; text-align: center; font-size: 14px; margin-top: 10px;" class="hidden"></div>
        </div>

        <!-- 房间内 -->
        <div id="view-room" class="hidden">
            <h2>房间中</h2>
            <div class="room-code" id="display-room-code">0000</div>
            <div id="room-status" class="status-text">等待对方加入...</div>
            
            <!-- 胜利横幅 -->
            <div id="win-banner" class="win-banner hidden">
                🎉 恭喜！你们的心有灵犀！
            </div>

            <!-- 词语提交区 -->
            <div id="game-play-area" class="hidden" style="margin-top: 20px;">
                <input type="text" id="word-input" placeholder="输入你想到的词..." maxlength="20" style="text-align: center;">
                <button onclick="submitWord()">提交</button>
            </div>

            <!-- 历史记录展示区 -->
            <div id="history-area" class="history-container hidden">
                <div class="history-title">—— 过往回合记录 ——</div>
                <div id="history-list"></div>
            </div>
            
            <button onclick="goHome()" style="background-color: transparent; color: #888; box-shadow: none; border: 1px solid #ddd; margin-top: 20px;">退出房间</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wpvvgctsxgljzikrtedk.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_Ecr2t1v8CEUG1LwPNsLvbQ_5F0BXm2y';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRoomCode = null;
        let pollInterval = null;
        let playerAName = "";
        let playerBName = "";
        let myName = "";

        function showView(viewId) {
            document.querySelectorAll('.card > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showJoinView() {
            if(!checkNickname()) return;
            showView('view-join');
        }

        function goHome() {
            document.getElementById('join-error').classList.add('hidden');
            showView('view-home');
            if(pollInterval) clearInterval(pollInterval);
        }

        function checkNickname() {
            const name = document.getElementById('nickname').value.trim();
            if(!name) { alert('请先输入昵称哦~'); return false; }
            myName = name;
            return true;
        }

        async function ensureAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw new Error("匿名登录失败: " + error.message);
                currentUser = data.user;
            } else {
                currentUser = session.user;
            }
        }

        async function createGame() {
            if(!checkNickname()) return;
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('create_game', { p_name: myName });
                if (error) throw error;
                currentRoomCode = data.room_code;
                enterRoomView(currentRoomCode);
            } catch (err) { alert(err.message); }
        }

        async function joinGame() {
            if(!checkNickname()) return;
            const code = document.getElementById('join-code').value.trim();
            const errorEl = document.getElementById('join-error');
            if(!code || code.length !== 4) {
                errorEl.innerText = "请输入正确的4位房间号";
                errorEl.classList.remove('hidden');
                return;
            }
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('join_game', { p_code: code, p_name: myName });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                currentRoomCode = code;
                enterRoomView(currentRoomCode);
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function enterRoomView(code) {
            showView('view-room');
            document.getElementById('display-room-code').innerText = code;
            checkRoomState();
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkRoomState, 2000); 
        }

        async function checkRoomState() {
            if(!currentRoomCode) return;
            try {
                const { data, error } = await supabaseClient.rpc('get_game_state', { p_code: currentRoomCode });
                if (error) throw error;

                const statusEl = document.getElementById('room-status');
                const playArea = document.getElementById('game-play-area');
                const historyArea = document.getElementById('history-area');
                const winBanner = document.getElementById('win-banner');

                playerAName = data.player_a_name || "玩家A";
                playerBName = data.player_b_name || "玩家B";

                if (data.status === 'waiting') {
                    statusEl.innerText = "等待对方加入...";
                    playArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                } else if (data.status === 'playing') {
                    // 判断我是不是 A
                    const isMeA = (myName === data.player_a_name);
                    const myOpponentName = isMeA ? playerBName : playerAName;

                    if (data.is_win) {
                        // 最终胜利
                        statusEl.innerText = "游戏结束";
                        playArea.classList.add('hidden');
                        winBanner.classList.remove('hidden');
                    } else {
                        winBanner.classList.add('hidden');
                        
                        // 检查我是不是已经提交了
                        const iSubmitted = isMeA ? data.has_a_submitted : data.has_b_submitted;
                        if (iSubmitted) {
                            statusEl.innerText = "已提交，等待对方...";
                            playArea.classList.add('hidden');
                        } else {
                            statusEl.innerText = `第 ${data.current_round} 回合，请出题`;
                            playArea.classList.remove('hidden');
                        }
                    }

                    // 渲染历史记录
                    if (data.history && data.history.length > 0) {
                        historyArea.classList.remove('hidden');
                        const listEl = document.getElementById('history-list');
                        listEl.innerHTML = '';
                        
                        data.history.forEach(item => {
                            const isWinRound = (item.player_a_word === item.player_b_word);
                            const div = document.createElement('div');
                            div.className = `history-item ${isWinRound ? 'win-round' : ''}`;
                            
                            // 根据我是谁，把对方的名字放在前面（或者标明）
                            div.innerHTML = `
                                <span style="color:#888;">第${item.round_number}局</span>
                                <div>
                                    <span class="word-tag">${isMeA ? item.player_a_word : item.player_b_word}</span> 
                                    <span style="color:#ccc; margin: 0 5px;">VS</span> 
                                    <span class="word-tag">${isMeA ? item.player_b_word : item.player_a_word}</span>
                                </div>
                            `;
                            listEl.appendChild(div);
                        });
                    }
                }
            } catch (err) { console.error("轮询出错", err); }
        }

        async function submitWord() {
            const word = document.getElementById('word-input').value.trim();
            if(!word) return alert("词语不能为空");
            try {
                const { data, error } = await supabaseClient.rpc('submit_game_word', { p_code: currentRoomCode, p_word: word });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                document.getElementById('word-input').value = '';
                checkRoomState(); // 提交后立刻更新状态
            } catch (err) { alert("提交失败: " + err.message); }
        }
    </script>
</body>
</html>
