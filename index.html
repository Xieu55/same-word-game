<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同词相遇</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FFF5F7;       
            --card-bg: #FFFFFF;        
            --primary-pink: #F7A8B8;   
            --hover-pink: #F490A3;     
            --text-main: #4A4A4A;      
            --accent-lilac: #E2D4F0;   
            --cream: #FFFDF9;          
            --radius: 20px;            
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 24px;
            box-shadow: 0 8px 24px rgba(247, 168, 184, 0.15);
            width: 100%;
            max-width: 360px;
        }
        .hidden { display: none !important; }
        h2 { text-align: center; color: var(--primary-pink); margin-top: 0; }
        p { text-align: center; font-size: 14px; color: #888; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--accent-lilac);
            background-color: var(--cream);
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: var(--primary-pink); }
        button {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        button:hover { background-color: var(--hover-pink); transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        
        .room-code {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-pink);
            letter-spacing: 4px;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            background: var(--cream);
            border-radius: var(--radius);
            border: 2px dashed var(--accent-lilac);
        }
        .status-text { text-align: center; font-weight: bold; margin-top: 10px; color: #555;}
        
        /* 结算面板样式 */
        .result-panel {
            background-color: var(--cream);
            border-radius: var(--radius);
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            border: 1px dashed var(--accent-lilac);
        }
        .result-panel.lose {
            background-color: #FFF0F1; /* 柔和的失败红 */
            border-color: #FFCDD2;
        }
        .result-panel.win {
            background-color: #E8F5E9; /* 柔和的成功绿 */
            border-color: #C8E6C9;
        }
        .words-display {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }
        .word-box {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            width: 40%;
            font-weight: bold;
            color: var(--primary-pink);
            word-break: break-all;
        }
        .word-box span {
            display: block;
            font-size: 12px;
            color: #888;
            font-weight: normal;
            margin-bottom: 5px;
        }
        
        /* 历史记录 */
        .history-list {
            margin-top: 15px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 13px;
            color: #888;
            border-top: 1px dashed #eee;
            padding-top: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1px dashed #eee;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- 首页 -->
        <div id="view-home">
            <h2>同词相遇 🌸</h2>
            <p>直到你们想出同一个词</p>
            <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            <button onclick="createGame()">创建新房间</button>
            <button onclick="showJoinView()" style="background-color: var(--accent-lilac); color: #555;">加入房间</button>
        </div>

        <!-- 加入房间 -->
        <div id="view-join" class="hidden">
            <h2>加入房间</h2>
            <input type="text" id="join-code" placeholder="输入4位房间号" maxlength="4" style="text-align: center; font-size: 24px; letter-spacing: 4px;">
            <button onclick="joinGame()">确认加入</button>
            <button onclick="goHome()" style="background-color: transparent; color: #888; box-shadow: none; border: 1px solid #ddd;">返回</button>
            <div id="join-error" style="color: red; text-align: center; font-size: 14px; margin-top: 10px;" class="hidden"></div>
        </div>

        <!-- 房间内 -->
        <div id="view-room" class="hidden">
            <h2>房间中</h2>
            <div class="room-code" id="display-room-code">0000</div>
            <div id="room-status" class="status-text">等待对方加入...</div>
            
            <!-- 词语提交区 -->
            <div id="game-play-area" class="hidden" style="margin-top: 20px;">
                <input type="text" id="word-input" placeholder="输入你想到的词..." maxlength="20" style="text-align: center;">
                <button onclick="submitWord()">提交</button>
            </div>

            <!-- 双方提交后的结算展示区 -->
            <div id="result-area" class="hidden">
                <div id="result-panel" class="result-panel">
                    <h3 id="result-title" style="margin: 0; color: #555;">结算</h3>
                    <div class="words-display">
                        <div class="word-box" id="word-a"><span id="name-a">玩家A</span>词语A</div>
                        <div class="word-box" id="word-b"><span id="name-b">玩家B</span>词语B</div>
                    </div>
                </div>
                <button id="next-btn" onclick="requestNextRound()" style="margin-top: 15px;">准备好了，下一局</button>
            </div>

            <!-- 历史记录展示区 -->
            <div id="history-area" class="hidden">
                <div class="history-list" id="history-list"></div>
            </div>
            
            <button onclick="goHome()" style="background-color: transparent; color: #888; box-shadow: none; border: 1px solid #ddd; margin-top: 20px;">退出房间</button>
        </div>
    </div>

    <script>
        // 你的 Supabase 配置
        const SUPABASE_URL = 'https://wpvvgctsxgljzikrtedk.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_Ecr2t1v8CEUG1LwPNsLvbQ_5F0BXm2y';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRoomCode = null;
        let pollInterval = null;
        let myName = "";

        function showView(viewId) {
            document.querySelectorAll('.card > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showJoinView() {
            if(!checkNickname()) return;
            showView('view-join');
        }

        function goHome() {
            document.getElementById('join-error').classList.add('hidden');
            showView('view-home');
            if(pollInterval) clearInterval(pollInterval);
        }

        function checkNickname() {
            const name = document.getElementById('nickname').value.trim();
            if(!name) { alert('请先输入昵称哦~'); return false; }
            myName = name;
            return true;
        }

        async function ensureAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw new Error("匿名登录失败: " + error.message);
                currentUser = data.user;
            } else {
                currentUser = session.user;
            }
        }

        async function createGame() {
            if(!checkNickname()) return;
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('create_game', { p_name: myName });
                if (error) throw error;
                currentRoomCode = data.room_code;
                enterRoomView(currentRoomCode);
            } catch (err) { alert(err.message); }
        }

        async function joinGame() {
            if(!checkNickname()) return;
            const code = document.getElementById('join-code').value.trim();
            const errorEl = document.getElementById('join-error');
            if(!code || code.length !== 4) {
                errorEl.innerText = "请输入正确的4位房间号";
                errorEl.classList.remove('hidden');
                return;
            }
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('join_game', { p_code: code, p_name: myName });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                currentRoomCode = code;
                enterRoomView(currentRoomCode);
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function enterRoomView(code) {
            showView('view-room');
            document.getElementById('display-room-code').innerText = code;
            checkRoomState();
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkRoomState, 2000); 
        }

        async function checkRoomState() {
            if(!currentRoomCode) return;
            try {
                const { data, error } = await supabaseClient.rpc('get_game_state', { p_code: currentRoomCode });
                if (error) throw error;

                const statusEl = document.getElementById('room-status');
                const playArea = document.getElementById('game-play-area');
                const resultArea = document.getElementById('result-area');
                const historyArea = document.getElementById('history-area');

                if (data.status === 'waiting') {
                    statusEl.innerText = "等待对方加入...";
                    playArea.classList.add('hidden');
                    resultArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                } else if (data.status === 'playing') {
                    historyArea.classList.remove('hidden');
                    renderHistory(data.history);

                    // 判断我是不是玩家A
                    const isMeA = (myName === data.player_a_name);

                    // 如果双方都提交了
                    if (data.has_a_submitted && data.has_b_submitted) {
                        statusEl.innerText = `第 ${data.current_round} 回合 结算`;
                        playArea.classList.add('hidden');
                        resultArea.classList.remove('hidden');
                        document.getElementById('next-btn').classList.remove('hidden');

                        const resultPanel = document.getElementById('result-panel');
                        const isWin = (data.player_a_word === data.player_b_word);
                        
                        document.getElementById('result-title').innerText = isWin ? "🎉 同词相遇！" : "💔 擦肩而过";
                        resultPanel.className = `result-panel ${isWin ? 'win' : 'lose'}`;

                        document.getElementById('word-a').innerHTML = `<span>${data.player_a_name}</span>${data.player_a_word}`;
                        document.getElementById('word-b').innerHTML = `<span>${data.player_b_name}</span>${data.player_b_word}`;

                        if (isWin) {
                            document.getElementById('next-btn').classList.add('hidden'); 
                        }

                    } else {
                        // 没全提交
                        resultArea.classList.add('hidden');
                        const iSubmitted = isMeA ? data.has_a_submitted : data.has_b_submitted;
                        if (iSubmitted) {
                            statusEl.innerText = "已提交，等待对方...";
                            playArea.classList.add('hidden');
                        } else {
                            statusEl.innerText = `第 ${data.current_round} 回合，请出题`;
                            playArea.classList.remove('hidden');
                        }
                    }
                }
            } catch (err) { console.error("轮询出错", err); }
        }

        function renderHistory(history) {
            if (!history || history.length === 0) {
                document.getElementById('history-list').innerHTML = '<div style="text-align:center; padding:10px;">暂无记录</div>';
                return;
            }
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            history.forEach(item => {
                const isWin = (item.player_a_word === item.player_b_word);
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span>第${item.round_number}局</span>
                    <span>${item.player_a_word} VS ${item.player_b_word} ${isWin ? '🎉' : ''}</span>
                `;
                listEl.appendChild(div);
            });
        }

        async function submitWord() {
            const word = document.getElementById('word-input').value.trim();
            if(!word) return alert("词语不能为空");
            try {
                const { data, error } = await supabaseClient.rpc('submit_game_word', { p_code: currentRoomCode, p_word: word });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                document.getElementById('word-input').value = '';
                checkRoomState();
            } catch (err) { alert("提交失败: " + err.message); }
        }

        // 点击“下一局”
        async function requestNextRound() {
            try {
                const { data, error } = await supabaseClient.rpc('next_round', { p_code: currentRoomCode });
                if (error) throw error;
                checkRoomState();
            } catch (err) { alert("刷新失败: " + err.message); }
        }
    </script>
</body>
</html>
