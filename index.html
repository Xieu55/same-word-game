<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同词相遇</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FFF5F7;        
            --card-bg: #FFFFFF;         
            --text-main: #4A4A4A;       
            --text-muted: #A0A0A0;
            --primary-pink: #F7A8B8;    
            --soft-pink: #FFF0F5;       
            --soft-lilac: #F5F0FA;      
            --radius: 20px;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card { background-color: transparent; width: 100%; max-width: 360px; box-sizing: border-box; }
        .hidden { display: none !important; }

        .room-header { text-align: center; font-size: 12px; color: #C0C0C0; margin-bottom: 24px; }
        .room-header b { color: #999; margin-left: 4px; }

        h2 { text-align: center; font-size: 22px; color: var(--text-main); margin: 0 0 8px 0; }
        p { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }

        input {
            width: 100%; padding: 16px; border-radius: var(--radius); border: 1.5px solid transparent;
            background-color: var(--card-bg); font-size: 15px; box-sizing: border-box; margin-bottom: 12px;
            outline: none; text-align: center; color: var(--text-main);
            box-shadow: 0 4px 16px rgba(247, 168, 184, 0.08); transition: all 0.3s;
        }
        input:focus { border-color: var(--primary-pink); }
        input::placeholder { color: #D0D0D0; }

        button {
            background-color: var(--primary-pink); color: white; border: none; border-radius: var(--radius);
            padding: 16px; font-size: 16px; width: 100%; cursor: pointer; transition: all 0.2s ease;
            margin-bottom: 12px; box-shadow: 0 4px 12px rgba(247, 168, 184, 0.3);
        }
        button:hover { background-color: #F490A3; }
        
        .btn-secondary { background-color: transparent; color: #B0B0B0; box-shadow: none; font-size: 14px; }

        .status-text { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 24px; min-height: 20px; }

        .history-container { margin-top: 10px; max-height: 280px; overflow-y: auto; padding-bottom: 10px; }
        .history-item { display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }

        .word-bubble { 
            padding: 12px 20px; border-radius: 18px; text-align: center; font-size: 15px; 
            color: var(--text-main); max-width: 42%; word-break: break-all;
        }
        .word-a { background-color: var(--soft-pink); color: #D87A94; border-bottom-right-radius: 6px; }
        .word-b { background-color: var(--soft-lilac); color: #8E7AA8; border-bottom-left-radius: 6px; }
        
        .vs-mark { font-size: 13px; color: #E0E0E0; margin: 0 12px; }

        .poster { text-align: center; }
        .poster-title { font-size: 24px; color: var(--primary-pink); margin-bottom: 8px;}
        .poster-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 30px;}
        
        .final-word-box {
            background: var(--card-bg); padding: 24px; border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(247, 168, 184, 0.15); margin-bottom: 30px;
        }
        .final-word-box span { display: block; font-size: 12px; color: #999; margin-bottom: 8px;}
        .final-word-box b { font-size: 28px; color: var(--primary-pink); letter-spacing: 2px;}
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- 首页 -->
        <div id="view-home">
            <h2>同词相遇 🌸</h2>
            <p>看看你们的脑回路是否一致</p>
            <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            <button onclick="createGame()">创建新房间</button>
            <button onclick="showJoinView()" class="btn-secondary">加入房间</button>
        </div>

        <!-- 加入房间 -->
        <div id="view-join" class="hidden">
            <h2>加入房间</h2>
            <input type="text" id="join-code" placeholder="输入4位房间号" maxlength="4" style="font-size: 24px; letter-spacing: 4px;">
            <button onclick="joinGame()">确认加入</button>
            <button onclick="goHome()" class="btn-secondary">返回</button>
            <div id="join-error" style="color: #E57373; text-align: center; font-size: 13px; margin-top: 10px;" class="hidden"></div>
        </div>

        <!-- 房间内 -->
        <div id="view-room" class="hidden">
            <div class="room-header">房间号 <b id="display-room-code">0000</b></div>
            
            <div id="room-status" class="status-text">等待对方加入...</div>
            
            <div id="game-play-area" class="hidden">
                <input type="text" id="word-input" placeholder="输入词语..." maxlength="20">
                <button onclick="submitWord()">提交</button>
            </div>

            <div id="history-area" class="hidden">
                <div class="history-container" id="history-list"></div>
            </div>
            
            <button onclick="goHome()" class="btn-secondary" style="margin-top: 20px;">退出房间</button>
        </div>

        <!-- 结局展示 -->
        <div id="view-poster" class="hidden">
            <div class="poster">
                <h2 class="poster-title">🎉 同词相遇！</h2>
                <div class="poster-sub">共经过 <span id="poster-rounds">0</span> 轮默契考验</div>
                
                <div class="final-word-box">
                    <span>最终相同词语</span>
                    <b id="poster-final-word">-</b>
                </div>

                <div class="history-container" id="poster-history-list" style="max-height: 220px; text-align: left; margin-bottom: 20px;"></div>
                
                <button onclick="goHome()" style="margin-top: 10px;">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wpvvgctsxgljzikrtedk.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_Ecr2t1v8CEUG1LwPNsLvbQ_5F0BXm2y';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRoomCode = null;
        let pollInterval = null;
        let myName = "";

        function showView(viewId) {
            document.querySelectorAll('.card > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showJoinView() {
            if(!checkNickname()) return;
            showView('view-join');
        }

        function goHome() {
            document.getElementById('join-error').classList.add('hidden');
            showView('view-home');
            if(pollInterval) clearInterval(pollInterval);
            currentRoomCode = null;
        }

        function checkNickname() {
            const name = document.getElementById('nickname').value.trim();
            if(!name) { alert('请先输入昵称哦'); return false; }
            myName = name;
            return true;
        }

        async function ensureAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if (error) throw new Error("登录失败: " + error.message);
                currentUser = data.user;
            } else {
                currentUser = session.user;
            }
        }

        async function createGame() {
            if(!checkNickname()) return;
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('create_game', { p_name: myName });
                if (error) throw error;
                currentRoomCode = data.room_code;
                enterRoomView(currentRoomCode);
            } catch (err) { alert(err.message); }
        }

        async function joinGame() {
            if(!checkNickname()) return;
            const code = document.getElementById('join-code').value.trim();
            const errorEl = document.getElementById('join-error');
            if(!code || code.length !== 4) {
                errorEl.innerText = "请输入正确的4位房间号";
                errorEl.classList.remove('hidden');
                return;
            }
            try {
                await ensureAuth();
                const { data, error } = await supabaseClient.rpc('join_game', { p_code: code, p_name: myName });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                currentRoomCode = code;
                enterRoomView(currentRoomCode);
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function enterRoomView(code) {
            showView('view-room');
            document.getElementById('display-room-code').innerText = code;
            checkRoomState();
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkRoomState, 1500); 
        }

        async function checkRoomState() {
            if(!currentRoomCode) return;
            try {
                const { data, error } = await supabaseClient.rpc('get_game_state', { p_code: currentRoomCode });
                if (error) throw error;

                if (data.is_win) {
                    if(pollInterval) clearInterval(pollInterval);
                    showView('view-poster');
                    renderPoster(data);
                    return;
                }

                const statusEl = document.getElementById('room-status');
                const playArea = document.getElementById('game-play-area');
                const historyArea = document.getElementById('history-area');

                if (data.status === 'waiting') {
                    statusEl.innerText = "等待对方加入...";
                    playArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                } else if (data.status === 'playing') {
                    
                    if (data.history && data.history.length > 0) {
                        historyArea.classList.remove('hidden');
                        renderHistory(data.history);
                    } else {
                        historyArea.classList.add('hidden');
                    }

                    const isMeA = (myName === data.player_a_name);

                    if (data.player_a_word === null && data.player_b_word === null) {
                        statusEl.innerText = `第 ${data.current_round} 轮`;
                        playArea.classList.remove('hidden');
                    } else {
                        const iSubmitted = isMeA ? data.has_a_submitted : data.has_b_submitted;
                        if (iSubmitted) {
                            statusEl.innerText = "已提交，等待对方...";
                            playArea.classList.add('hidden');
                        } else {
                            statusEl.innerText = `第 ${data.current_round} 轮`;
                            playArea.classList.remove('hidden');
                        }
                    }
                }
            } catch (err) { console.error("轮询出错", err); }
        }

        function renderHistory(history) {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            history.forEach(item => {
                const isWin = (item.player_a_word === item.player_b_word && item.player_a_word !== null);
                const div = document.createElement('div');
                div.className = `history-item`;
                
                const styleA = isWin ? 'border: 1px solid #E8F5E9;' : '';
                const styleB = isWin ? 'border: 1px solid #E8F5E9;' : '';

                div.innerHTML = `
                    <div class="word-bubble word-a" style="${styleA}">${item.player_a_word || '...'}</div>
                    <div class="vs-mark">×</div>
                    <div class="word-bubble word-b" style="${styleB}">${item.player_b_word || '...'}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function renderPoster(data) {
            document.getElementById('poster-rounds').innerText = data.history.length;
            document.getElementById('poster-final-word').innerText = data.player_a_word;

            const listEl = document.getElementById('poster-history-list');
            listEl.innerHTML = '';
            const sortedHistory = [...data.history].sort((a, b) => a.round_number - b.round_number);
            
            sortedHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item`;
                div.innerHTML = `
                    <div class="word-bubble word-a" style="padding: 8px 12px; font-size: 14px;">${item.player_a_word || '...'}</div>
                    <div class="vs-mark">×</div>
                    <div class="word-bubble word-b" style="padding: 8px 12px; font-size: 14px;">${item.player_b_word || '...'}</div>
                `;
                listEl.appendChild(div);
            });
        }

        async function submitWord() {
            const wordInput = document.getElementById('word-input');
            const word = wordInput.value.trim();
            if(!word) return alert("词语不能为空");
            
            try {
                const { data, error } = await supabaseClient.rpc('submit_game_word', { p_code: currentRoomCode, p_word: word });
                if (error) throw error;
                if (data.error) throw new Error(data.error);
                
                // 加回了这句最关键的：提交成功后，立刻把输入框清空！
                wordInput.value = '';
                
                checkRoomState(); 
            } catch (err) { alert("提交失败: " + err.message); }
        }
    </script>
</body>
</html>
